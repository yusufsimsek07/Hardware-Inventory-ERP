<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hata - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center">
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                <h2 class="mt-3 mb-3">Bir Hata Olustu!</h2>
                <div class="alert alert-danger" th:if="${errorMessage}">
                    <p th:text="${errorMessage}">Hata mesaji burada gorunecek.</p>
                </div>
                <div class="alert alert-danger" th:unless="${errorMessage}">
                    <p>Beklenmeyen bir hata olustu. Lutfen tekrar deneyin.</p>
                </div>
                <a th:href="@{/}" class="btn btn-primary mt-3">
                    <i class="bi bi-house-door"></i> Ana Sayfaya Don
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
