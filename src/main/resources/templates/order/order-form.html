<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Siparis Formu - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="page-header">
            <h1>
                <i class="bi bi-cart-check"></i>
                <span th:if="${customerOrder.id == null}">Yeni Siparis Olustur</span>
                <span th:unless="${customerOrder.id == null}">Siparis Duzenle</span>
            </h1>
        </div>

        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/orders/save}" th:object="${customerOrder}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" th:field="*{totalAmount}"/>

                        <div class="mb-3">
                            <label for="orderDate" class="form-label">Siparis Tarihi <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="orderDate" th:field="*{orderDate}"/>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Siparis Durumu <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" th:field="*{status}"
                                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                                <option value="">-- Durum Seciniz --</option>
                                <option value="Beklemede">Beklemede</option>
                                <option value="Hazirlaniyor">Hazirlaniyor</option>
                                <option value="Tamamlandi">Tamamlandi</option>
                                <option value="Iptal">Iptal</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-check-circle"></i> Kaydet
                            </button>
                            <a th:href="@{/orders}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Iptal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
