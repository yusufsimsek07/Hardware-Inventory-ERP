<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Urun Listesi - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center page-header">
            <h1><i class="bi bi-box-seam"></i> Urun Listesi</h1>
            <a th:href="@{/products/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Yeni Urun Ekle
            </a>
        </div>

        <!-- Flash Message -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show flash-message" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Product Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Barkod</th>
                    <th>Urun Adi</th>
                    <th>Fiyat (TL)</th>
                    <th>Stok</th>
                    <th>Kategori</th>
                    <th>Tedarikci</th>
                    <th>Depo</th>
                    <th>Islemler</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td><code th:text="${product.barcode}"></code></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                    <td>
                        <span class="badge bg-success" th:if="${product.stockQuantity > 10}"
                              th:text="${product.stockQuantity}"></span>
                        <span class="badge bg-warning text-dark" th:if="${product.stockQuantity > 0 and product.stockQuantity <= 10}"
                              th:text="${product.stockQuantity}"></span>
                        <span class="badge bg-danger" th:if="${product.stockQuantity == 0}">Tukendi</span>
                    </td>
                    <td th:text="${product.category.name}"></td>
                    <td th:text="${product.supplier.companyName}"></td>
                    <td th:text="${product.warehouse.name}"></td>
                    <td>
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary btn-action">
                            <i class="bi bi-pencil"></i> Duzenle
                        </a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-outline-danger btn-action"
                           onclick="return confirm('Bu urunu silmek istediginizden emin misiniz?');">
                            <i class="bi bi-trash"></i> Sil
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="9" class="text-center text-muted py-4">
                        <i class="bi bi-inbox display-6"></i>
                        <p class="mt-2">Henuz urun eklenmemis.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
