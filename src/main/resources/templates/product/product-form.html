<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Urun Formu - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="page-header">
            <h1>
                <i class="bi bi-box-seam"></i>
                <span th:if="${product.id == null}">Yeni Urun Ekle</span>
                <span th:unless="${product.id == null}">Urun Duzenle</span>
            </h1>
        </div>

        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/products/save}" th:object="${product}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Barcode -->
                        <div class="mb-3">
                            <label for="barcode" class="form-label">Barkod <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="barcode" th:field="*{barcode}"
                                   th:classappend="${#fields.hasErrors('barcode')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></div>
                        </div>

                        <!-- Product Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Urun Adi <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Price -->
                        <div class="mb-3">
                            <label for="price" class="form-label">Fiyat (TL) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <!-- Stock Quantity -->
                        <div class="mb-3">
                            <label for="stockQuantity" class="form-label">Stok Miktari <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="stockQuantity" th:field="*{stockQuantity}"
                                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                        </div>

                        <!-- Category Dropdown -->
                        <div class="mb-3">
                            <label for="category" class="form-label">Kategori <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" th:field="*{category}"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                <option value="">-- Kategori Seciniz --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <!-- Supplier Dropdown -->
                        <div class="mb-3">
                            <label for="supplier" class="form-label">Tedarikci <span class="text-danger">*</span></label>
                            <select class="form-select" id="supplier" th:field="*{supplier}"
                                    th:classappend="${#fields.hasErrors('supplier')} ? 'is-invalid' : ''">
                                <option value="">-- Tedarikci Seciniz --</option>
                                <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.companyName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}"></div>
                        </div>

                        <!-- Warehouse Dropdown -->
                        <div class="mb-3">
                            <label for="warehouse" class="form-label">Depo <span class="text-danger">*</span></label>
                            <select class="form-select" id="warehouse" th:field="*{warehouse}"
                                    th:classappend="${#fields.hasErrors('warehouse')} ? 'is-invalid' : ''">
                                <option value="">-- Depo Seciniz --</option>
                                <option th:each="wh : ${warehouses}" th:value="${wh.id}" th:text="${wh.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('warehouse')}" th:errors="*{warehouse}"></div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Kaydet
                            </button>
                            <a th:href="@{/products}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Iptal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
