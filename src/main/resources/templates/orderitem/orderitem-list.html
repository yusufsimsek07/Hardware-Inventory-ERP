<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Siparis Kalemleri - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center page-header">
            <h1>
                <i class="bi bi-list-ul"></i> Siparis #<span th:text="${order.id}"></span> - Kalemler
            </h1>
            <div>
                <a th:href="@{/order-items/new/{orderId}(orderId=${order.id})}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Kalem Ekle
                </a>
                <a th:href="@{/orders}" class="btn btn-secondary ms-2">
                    <i class="bi bi-arrow-left"></i> Siparislere Don
                </a>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <strong>Siparis Tarihi:</strong> <span th:text="${order.orderDate}"></span>
                    </div>
                    <div class="col-md-4">
                        <strong>Durum:</strong> <span th:text="${order.status}"></span>
                    </div>
                    <div class="col-md-4">
                        <strong>Toplam Tutar:</strong> <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span> TL
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show flash-message" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Urun</th>
                    <th>Miktar</th>
                    <th>Birim Fiyat (TL)</th>
                    <th>Ara Toplam (TL)</th>
                    <th>Islemler</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${orderItems}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.product.name}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 2)}"></td>
                    <td>
                        <a th:href="@{/order-items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary btn-action">
                            <i class="bi bi-pencil"></i> Duzenle
                        </a>
                        <a th:href="@{/order-items/delete/{id}(id=${item.id})}" class="btn btn-sm btn-outline-danger btn-action"
                           onclick="return confirm('Bu kalemi silmek istediginizden emin misiniz?');">
                            <i class="bi bi-trash"></i> Sil
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orderItems)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox display-6"></i>
                        <p class="mt-2">Bu siparise henuz kalem eklenmemis.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
