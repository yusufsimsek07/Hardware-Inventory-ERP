<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tedarikci Formu - Yapi Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="page-header">
            <h1>
                <i class="bi bi-truck"></i>
                <span th:if="${supplier.id == null}">Yeni Tedarikci Ekle</span>
                <span th:unless="${supplier.id == null}">Tedarikci Duzenle</span>
            </h1>
        </div>

        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label for="companyName" class="form-label">Firma Adi <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="companyName" th:field="*{companyName}"
                                   th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="contactName" class="form-label">Yetkili Kisi <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="contactName" th:field="*{contactName}"
                                   th:classappend="${#fields.hasErrors('contactName')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Telefon <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info text-white">
                                <i class="bi bi-check-circle"></i> Kaydet
                            </button>
                            <a th:href="@{/suppliers}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Iptal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
