<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:fragment="title">Yapi Market Stok Sistemi</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-building"></i> Yapi Market
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door"></i> Ana Sayfa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam"></i> Urunler</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categories}"><i class="bi bi-tags"></i> Kategoriler</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/suppliers}"><i class="bi bi-truck"></i> Tedarikciler</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/warehouses}"><i class="bi bi-house-gear"></i> Depolar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders}"><i class="bi bi-cart-check"></i> Siparisler</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>&copy; 2025 Yapi Market Stok ve Siparis Takip Sistemi - Internet Programlama Final Projesi</small>
    </div>
</footer>

</body>
</html>
